  <text x="120" y="468" fill="#17324A" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">核心能力模块</text>

  <rect x="124" y="510" width="198" height="142" rx="22" fill="#FFFFFF" stroke="#D7CFC2"/>
  <text x="154" y="556" fill="#17324A" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">结构分解</text>
  <text x="154" y="594" fill="#546575" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">DM/BTF 构造 UBTF</text>
  <text x="154" y="624" fill="#546575" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">限制 fill-in 扩散</text>

  <rect x="344" y="510" width="198" height="142" rx="22" fill="#FFFFFF" stroke="#D7CFC2"/>
  <text x="374" y="556" fill="#17324A" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">并行调度</text>
  <text x="374" y="594" fill="#546575" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">Block-DAG + 线程池</text>
  <text x="374" y="624" fill="#546575" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">work-stealing 抑制长尾</text>

  <rect x="564" y="510" width="198" height="142" rx="22" fill="#FFFFFF" stroke="#D7CFC2"/>
  <text x="594" y="556" fill="#17324A" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">稳健回退</text>
  <text x="594" y="594" fill="#546575" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">rcond / NaN / residual</text>
  <text x="594" y="624" fill="#546575" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">优先保证 err_user ≤ ε</text>

