name: windows-build-and-test

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 --branch 2024.05.24 https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe" install suitesparse:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S .\blockdaglu -B .\build\blockdaglu `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBLOCKDAGLU_USE_LINKED_SUITESPARSE=ON `
            -DBLOCKDAGLU_BUILD_COMPAT_SPARSEMATRIXLUTEST=OFF `
            -DBLOCKDAGLU_BUILD_SMOKETEST=OFF `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build
        run: cmake --build .\build\blockdaglu --config Release -j

      - name: Run CTest
        shell: pwsh
        run: |
          ctest --test-dir .\build\blockdaglu -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "CTest failed" }

      - name: Run minimal example
        run: .\build\blockdaglu\Release\blockdaglu_minimal.exe

      - name: Check showcase sources
        shell: pwsh
        run: |
          node --check .\showcase\app.js
          if ($LASTEXITCODE -ne 0) { throw "showcase JavaScript syntax check failed" }
          .\scripts\check_showcase.ps1
